- type: insightTrait
  id: AnomalySense
  name: insight-rationalist-anomaly-sense-name
  content: insight-rationalist-anomaly-sense-desc
  next: ArtifactReroll
  trait: AnomalySense

- type: trait
  id: AnomalySense
  name: insight-rationalist-anomaly-sense-name
  description: insight-rationalist-anomaly-sense-desc
  selectable: false
  components:
    - type: ActionGrant
      actions:
        - ActionAnomalySense
      autoDelete: true

- type: entity
  parent: BaseAction
  id: ActionAnomalySense
  name: Sense Anomaly
  description: Sense the location of the nearest anomaly.
  components:
  - type: Action
    useDelay: 30
  - type: Sprite
    sprite: Clothing/Neck/Misc/pins.rsi
    layers:
    - state: flower
  - type: InstantAction
    event: !type:SenseAnomalyEvent

- type: insightTrait
  id: ArtifactReroll
  name: insight-rationalist-reroll-node-name
  content: insight-rationalist-reroll-node-desc
  trait: ArtifactReroll

- type: trait
  id: ArtifactReroll
  name: insight-rationalist-reroll-node-name
  description: insight-rationalist-reroll-node-desc
  selectable: false
  components:
    - type: ActionGrant
      actions:
        - ActionArtifactReroll
      autoDelete: true

- type: entity
  parent: BaseAction
  id: ActionArtifactReroll
  name: Beggar's choice
  description: Reroll a node on an artifact (WIP).
  components:
  - type: Action
    useDelay: 30
  - type: Sprite
    sprite: Clothing/Neck/Misc/pins.rsi
    layers:
    - state: flower
  - type: InstantAction
    event: !type:ArtifactRerollEvent
