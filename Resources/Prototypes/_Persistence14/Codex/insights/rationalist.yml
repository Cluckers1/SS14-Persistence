- type: insightTrait
  id: AnomalySense
  name: Sense Anomaly
  content: "Gain the ability to sense the location of the nearest anomaly."
  next: ArtifactReroll
  trait: AnomalySense

- type: trait
  id: AnomalySense
  name: Sense Anomaly
  description: "Gain the ability to sense the location of the nearest anomaly."
  selectable: false
  components:
    - type: ActionGrant
      actions:
        - ActionAnomalySense
      autoDelete: true

- type: entity
  parent: BaseAction
  id: ActionAnomalySense
  name: Sense Anomaly
  description: Sense the location of the nearest anomaly.
  components:
  - type: Action
    useDelay: 30
  - type: Sprite
    sprite: Clothing/Neck/Misc/pins.rsi
    layers:
    - state: flower
  - type: InstantAction
    event: !type:SenseAnomalyEvent

- type: insightTrait
  id: ArtifactReroll
  name: Beggars Choice
  content: "Gain the ability to reroll one node in an artifact."

- type: trait
  id: ArtifactReroll
  name: Beggars Choice
  description: "Gain the ability to reroll one node in an artifact."
  selectable: false
  components:
    - type: ActionGrant
      actions:
        - ActionArtifactReroll
      autoDelete: true

- type: entity
  parent: BaseAction
  id: ActionArtifactReroll
  name: Sense Anomaly
  description: Sense the location of the nearest anomaly.
  components:
  - type: Action
    useDelay: 30
  - type: Sprite
    sprite: Clothing/Neck/Misc/pins.rsi
    layers:
    - state: flower
  - type: InstantAction
    event: !type:ArtifactRerollEvent
