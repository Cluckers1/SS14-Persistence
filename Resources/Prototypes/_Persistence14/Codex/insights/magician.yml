- type: insightTrait
  id: Magic1
  name: insight-magic-dark-vision-name
  content: insight-magic-dark-vision-desc
  next: Magic2
  trait: Magic1

- type: trait
  id: Magic1
  name: insight-magic-dark-vision-name
  description: insight-magic-dark-vision-desc
  selectable: false

- type: insightTrait
  id: Magic2
  name: Basic Summoner
  content: Summon some other-world tentacles to grab and stun people!
  next: MagicTest3
  trait: Magic2

- type: trait
  id: Magic2
  name: Basic Summoner
  description: Summon some other-world tentacles to grab and stun people!
  selectable: false
  components:
  - type: ActionGrant
    actions:
      - ActionGoliathTentacleInsight
    autoDelete: true

- type: entity
  parent: BaseAction
  id: ActionGoliathTentacleInsight
  name: "[color=red]Summon Tentacles[/color]"
  description: Use your tentacles to grab and stun a target player!
  components:
  - type: Action
    raiseOnUser: true
    sound:
      path: "/Audio/Weapons/slash.ogg"
    useDelay: 120
  - type: Sprite
    sprite: Mobs/Aliens/Asteroid/goliath.rsi
    layers:
    - state: goliath_tentacle_spawn
      map: ["enum.ActionVisuals.Icon"]
    - state: goliath_tentacle_wiggle
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: TargetAction
    range: 6
  - type: WorldTargetAction
    event: !type:GoliathSummonTentacleAction

- type: insightTrait
  id: MagicTest3
  name: insight-magic-summon-name
  content: insight-magic-summon-desc
  trait: Priest1

