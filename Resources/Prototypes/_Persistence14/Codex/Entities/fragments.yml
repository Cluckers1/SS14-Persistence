- type: entity
  id: BaseCodexFragment
  parent: BaseItem
  name: codex fragment
  description: Using this will unlock a codex entry.
  abstract: true
  components:
  - type: Item
    storedRotation: -90
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#8FCBCB"
      - state: base-module-inhand-left
        color: "#A1A1A1"
      - state: base-part-inhand-left
      - state: base-stripes-inhand-left
        color: "#7D7D7D"
      right:
      - state: base-icon-inhand-right
        color: "#8FCBCB"
      - state: base-module-inhand-right
        color: "#A1A1A1"
      - state: base-part-inhand-right
      - state: base-stripes-inhand-right
        color: "#7D7D7D"
  - type: Sprite
    sprite: _Persistence14/Objects/Specific/Upgrades/modules.rsi
  - type: StaticPrice
    price: 100
  - type: CodexFragment

- type: entity
  id: MarineCodexFragment
  parent: BaseCodexFragment
  name: codex fragment (UNMC Remnant)
  components:
  - type: Sprite
    layers:
    - state: solar-legion
    - state: icon-SL
  - type: CodexFragment
    possibleEntries:
      - Marine101
      - Marine102
      - Marine103
      - Marine104
      - Marine105

- type: entity
  id: ShadowCodexFragment
  parent: BaseCodexFragment
  name: codex fragment (The Elders)
  components:
  - type: Sprite
    layers:
    - state: solar-legion
    - state: icon-SL
  - type: CodexFragment
    possibleEntries:
      - Shadow101
      - Shadow102
      - Shadow103
      - Shadow104
      - Shadow105

- type: entity
  id: ZenithCodexFragment
  parent: BaseCodexFragment
