- type: codexEntry
  id: Shadow101
  name: Story of the Elders
  content: "The Elders exist in the Threshold of the [bold]Shadow Universe[/bold]. Creatures of void and flesh exist within this cursed variant of the Threshold and they beckon life into this Threshold to be used for vile rituals and schemes.\n\nSome of these mortals are carelessly discarded when they cease to be of use to the [bold]Void Entities[/bold]. These mortals have slipped beyond the view of the [bold]Void Entities[/bold] and carved out a community within the cursed Threshold.\n\nThey call themselves 'The Elders'."
  order: 0
  category: Shadow
  unlockHint: "Use a Codex Fragment"

- type: codexEntry
  id: Shadow102
  name: Void Entities
  content: "The 'Shadow Universe' is named such because it is being devestated by the malign influence of creatures known as 'Void Entities'. The Void Entities did not originate from the Shadow Universe but abide within the connected Threshold and project mental influence through the Threshold Entrance.\n\nThe Void Creatures manipulate the space-faring civilizations of the Shadow Universe to funnel mortals into the Threshold. These mortals are used in schemes to generate and steal resonance which the Void Creatures need in huge quantities."
  order: 1
  category: Shadow
  unlockHint: "Use a Codex Fragment"

